services:
  atlas-local:
    image: mongodb/mongodb-atlas-local:latest
    container_name: lector-atlas-local
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGODB_INITDB_DATABASE=lector
    volumes:
      - atlas_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: lector-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  atlas_data:
  redis_data:
