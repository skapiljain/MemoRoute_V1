# =============================================================================
# MindEcho Kubernetes Secret Template
#
# SECURITY WARNING:
# DO NOT COMMIT REAL PASSWORDS, TOKENS, OR API KEYS TO GIT.
# This file is a template intended for local staging and schema reference.
#
# In production, inject secrets directly via your CI/CD pipeline or CLI:
#   kubectl create secret generic mindecho-secrets \
#     --namespace=mindecho \
#     --from-literal=JWT_SECRET="<SECURE_RANDOM_SECRET_KEY>" \
#     --from-literal=OPENAI_API_KEY="<ACTUAL_OPENAI_API_KEY>" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Or utilize a production Secret Manager (e.g. AWS Secrets Manager,
# HashiCorp Vault, or SealedSecrets / External Secrets Operator).
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: mindecho-secrets
  namespace: mindecho
  labels:
    app: mindecho
    tier: backend
type: Opaque
stringData:
  # Replace these placeholder tokens in your deployment environment:
  JWT_SECRET: "REPLACE_WITH_DEPLOYMENT_JWT_SECRET_KEY"
  OPENAI_API_KEY: "REPLACE_WITH_DEPLOYMENT_OPENAI_API_KEY"
