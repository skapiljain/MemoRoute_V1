apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mindecho-ingress
  namespace: mindecho
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
spec:
  rules:
    - host: mindecho.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: mindecho-api
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mindecho-web
                port:
                  number: 80
