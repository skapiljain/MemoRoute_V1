apiVersion: apps/v1
kind: Deployment
metadata:
  name: mindecho-web
  namespace: mindecho
  labels:
    app: mindecho-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mindecho-web
  template:
    metadata:
      labels:
        app: mindecho-web
    spec:
      containers:
        - name: web
          image: your-dockerhub-user/mindecho-web:v0.1.0
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mindecho-web
  namespace: mindecho
spec:
  selector:
    app: mindecho-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
